# Every push to main that carries a feat, fix, perf or breaking change
# publishes a release: the version comes from the commits since the last tag
# (scripts/next-version.sh), the notes too (scripts/release-notes.sh).
#
# Every GitHub backup signer downloads releases/latest on each run, so a
# release is live for everyone the moment it's published: the tests run
# before anything is built.
name: Auto Version

on:
  push:
    branches: [main]
    # woffux sync commits these through the API: nothing to release.
    paths-ignore:
      - '.github/workflows/sign.yml'
      - '.github/workflows/sign-manual.yml'
      - '.github/workflows/keepalive.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    if: github.repository == 'ngavilan-dogfy/woffux'  # forks are signers, not development copies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: steps.version.outputs.should_release != 'true'
        run: echo "No release. Only feat, fix, perf and breaking changes publish a version."

      - name: Setup Go
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.version.outputs.should_release == 'true'
        run: go test ./...

      - name: Build binaries
        if: steps.version.outputs.should_release == 'true'
        run: scripts/build-release.sh "${{ steps.version.outputs.tag }}"

      - name: Write release notes
        if: steps.version.outputs.should_release == 'true'
        run: scripts/release-notes.sh "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.previous_tag }}" > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"

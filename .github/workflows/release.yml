# A tag pushed by hand (git push origin v6.0.0) publishes that release. Tags
# created by Auto Version don't trigger this: GitHub doesn't start workflows
# from the workflow token.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    if: github.repository == 'ngavilan-dogfy/woffux'  # forks are signers, not development copies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Write release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

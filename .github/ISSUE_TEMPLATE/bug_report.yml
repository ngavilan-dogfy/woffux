name: Bug report
description: Something signed wrong, didn't sign, or looks broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. `woffux doctor` often points at the cause, and its output helps here.

        **Don't paste** passwords, tokens, your exact home coordinates or other people's data. Replace your name, email and company with made-up ones.

        Found a security problem? Please report it privately instead: see [SECURITY.md](https://github.com/ngavilan-dogfy/woffux/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead? For a missed or wrong sign, say when it should have happened.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Automatic signing (this Mac)
        - Automatic signing (GitHub Actions)
        - Dashboard
        - Setup, schedule or timing
        - Requests (telework, vacation…)
        - Install or update
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: woffux doctor
      description: The output of `woffux doctor`, with personal data replaced.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The command you ran, or what you did in the dashboard.
  - type: textarea
    id: logs
    attributes:
      label: Other relevant output
      description: For example `woffux agent status`, `woffux schedule`, `woffux timing`, or the failing command's output.
      render: text
  - type: input
    id: version
    attributes:
      label: woffux version
      description: The output of `woffux version`
      placeholder: v5.14.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5 (Apple Silicon)
